# Deploy de um ambiente. Mesma lógica para staging e produção: o que muda é o
# environment do Azure DevOps (produção tem aprovação) e o resource group.
# A lógica mora em scripts/ci/deploy.sh — a mesma que o GitHub Actions chama.
parameters:
  - name: environment
    type: string
  - name: adoEnvironment
    type: string
  - name: resourceGroup
    type: string

jobs:
  - deployment: Deploy
    displayName: Deploy ${{ parameters.environment }}
    environment: ${{ parameters.adoEnvironment }}
    timeoutInMinutes: 40
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self   # deployment job não faz checkout sozinho; precisamos dos scripts

            - task: AzureCLI@2
              displayName: Migrations → Api → web → smoke test (rollback se falhar)
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: >
                  bash scripts/ci/deploy.sh
                  ${{ parameters.environment }}
                  ${{ parameters.resourceGroup }}
                  $(acrLoginServer)
                  $(imageTag)
