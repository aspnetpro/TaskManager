# Pipeline do TaskManager (Cap. 13). Todo push e PR: build, testes, segurança.
# main: imagens no ACR (tag = commit SHA) → staging automático → produção com aprovação.
#
# Pré-requisitos no Azure DevOps (uma vez, ver docs/deploy.md):
#   - Service connection ARM com workload identity federation (OIDC): sem segredo.
#     A identidade dela precisa de AcrPush no ACR e Contributor nos RGs dos ambientes.
#   - Environments "taskmanager-staging" e "taskmanager-production"; o de produção
#     com check de aprovação (Approvals and checks → Approvals). Aprovação não vive no YAML.
#
# Nenhuma senha aqui nem em variable group: o banco usa Entra, os segredos da Api
# estão no Key Vault e quem lê é a identidade gerenciada da Api.

trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

variables:
  # Não-secretos, mas precisam existir em tempo de compilação (azureSubscription não aceita variable group).
  azureServiceConnection: sc-taskmanager
  acrName: acrtaskmanager
  acrLoginServer: acrtaskmanager.azurecr.io
  stagingResourceGroup: rg-taskmanager-staging
  productionResourceGroup: rg-taskmanager-production
  imageTag: $(Build.SourceVersion)
  isMain: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build & Test
    jobs:
      - job: Backend
        timeoutInMinutes: 30
        steps:
          - task: UseDotNet@2
            displayName: .NET SDK (global.json)
            inputs:
              useGlobalJson: true

          - task: Cache@2
            displayName: Cache NuGet
            inputs:
              key: 'nuget | "$(Agent.OS)" | Directory.Packages.props | **/*.csproj'
              restoreKeys: 'nuget | "$(Agent.OS)"'
              path: $(NUGET_PACKAGES)

          # TreatWarningsAsErrors: warning de analyzer ou de NuGet Audit quebra aqui.
          - script: dotnet build TaskManager.slnx -c Release
            displayName: dotnet build

          # Unitários + arquitetura + integração (Testcontainers usa o Docker do agente).
          - script: bash scripts/ci/coverage.sh
            displayName: dotnet test + cobertura (75% global, 90% Tasks.Domain)

          - task: PublishTestResults@2
            displayName: Publicar resultados de teste
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: coverage/**/*.trx

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage/report/Cobertura.xml

          # Scripts idempotentes das migrations: o aprovador de produção lê ESTE artifact.
          - script: |
              set -euo pipefail
              dotnet tool restore
              mkdir -p $(Build.ArtifactStagingDirectory)/migrations
              for module in Auth Tasks Notifications; do
                dotnet ef migrations script --idempotent --no-build --configuration Release \
                  --project src/Modules/$module/TaskManager.$module.Infrastructure \
                  --startup-project src/TaskManager.Api \
                  --context ${module}DbContext \
                  -o $(Build.ArtifactStagingDirectory)/migrations/$module.sql
              done
            displayName: Scripts SQL das migrations

          - publish: $(Build.ArtifactStagingDirectory)/migrations
            artifact: migrations-sql
            displayName: Publicar scripts das migrations

      - job: Frontend
        timeoutInMinutes: 15
        steps:
          - task: UseNode@1
            displayName: Node 24 LTS
            inputs:
              version: 24.x

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: 'npm | "$(Agent.OS)"'
              path: $(Pipeline.Workspace)/.npm

          - script: |
              set -euo pipefail
              npm ci --cache $(Pipeline.Workspace)/.npm --no-audit --no-fund
              npm run lint
              npm run typecheck
              npm test
              npm run build
            workingDirectory: frontend
            displayName: npm ci, lint, typecheck, test, build

  - stage: Security
    displayName: Security Scan
    dependsOn: []
    jobs:
      - job: Scan
        steps:
          - checkout: self
            fetchDepth: 0   # gitleaks varre o histórico inteiro, não só o último commit

          - task: UseDotNet@2
            inputs:
              useGlobalJson: true

          - script: bash scripts/ci/check-vulnerable-packages.sh
            displayName: NuGet vulnerável (inclusive transitivo)

          - script: npm audit --omit=dev --audit-level=high
            workingDirectory: frontend
            displayName: npm audit (dependências de produção)

          - script: >
              docker run --rm -v "$(Build.SourcesDirectory):/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
              git /repo --redact --exit-code 1
            displayName: Segredos no histórico (gitleaks)

  - stage: Images
    displayName: Docker Build & Push
    dependsOn: [Build, Security]
    jobs:
      - job: Images
        steps:
          - script: |
              set -euo pipefail
              for target in api web migrations; do
                case $target in
                  api)        context=.;        args="--target runtime" ;;
                  migrations) context=.;        args="--target migrations" ;;
                  web)        context=frontend; args="" ;;
                esac
                docker build $args --build-arg SOURCE_REVISION=$(imageTag) \
                  -t $(acrLoginServer)/taskmanager-$target:$(imageTag) $context
              done
            displayName: docker build (api, web, migrations)

          # Antes do push: imagem com CVE crítica/alta corrigível nem chega ao registry.
          - script: |
              set -euo pipefail
              for target in api web migrations; do
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0 \
                  image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress \
                  $(acrLoginServer)/taskmanager-$target:$(imageTag)
              done
            displayName: Trivy (CRITICAL/HIGH com correção disponível)

          - task: AzureCLI@2
            displayName: Push para o ACR
            condition: and(succeeded(), eq(variables.isMain, true))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name $(acrName)
                for target in api web migrations; do
                  docker push $(acrLoginServer)/taskmanager-$target:$(imageTag)
                done

  - stage: DeployStaging
    displayName: Deploy Staging
    dependsOn: Images
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: staging
          adoEnvironment: taskmanager-staging
          resourceGroup: $(stagingResourceGroup)

  - stage: DeployProduction
    displayName: Deploy Production
    dependsOn: DeployStaging
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - template: templates/deploy.yml
        parameters:
          environment: production
          adoEnvironment: taskmanager-production
          resourceGroup: $(productionResourceGroup)
