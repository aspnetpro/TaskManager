# Incluído em cada location: add_header dentro de location descarta os do server.
# CSP: só scripts do próprio host (XSS injetado não executa). style-src precisa de
# 'unsafe-inline' porque o sonner injeta <style> em runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# O TLS termina no ingress do Container Apps; o navegador ignora HSTS em http (dev local).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
